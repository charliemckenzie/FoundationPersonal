name: Runtime sync check

# Fails if .claude/ (Claude Code agents + skills) has drifted from the canonical
# .github/ (Copilot) definitions. Run `npm run sync-runtimes` locally to fix.

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - '.claude/agents/**'
      - '.claude/skills/**'
      - 'scripts/sync-runtimes.mjs'

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check .github → .claude are in sync
        run: node scripts/sync-runtimes.mjs --check
