name: CI

# Runs type-check, lint, build, lib build, and the full test suite on every PR
# and every push to main. Cheap fast-fail steps run before the heavy browser
# tests so failures surface quickly. Mark this check "required" in branch
# protection to block merges until all steps pass.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The internal Nexus `npm-proxy` mirror is unreachable from CI runners. If a
      # lockfile written on a Nexus-connected device reintroduces those hosts, rewrite
      # them to the public npm registry. The path after the host is identical and
      # integrity hashes are content-based, so this is safe and keeps `npm ci` in sync
      # with `package.json` (only hosts change). A no-op when the lockfile is clean.
      - name: Normalize lockfile registry hosts
        run: sed -i 's#https://nexus-repo/repository/npm-proxy/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Library build
        run: npm run lib:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test
